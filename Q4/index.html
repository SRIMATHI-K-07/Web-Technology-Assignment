<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Grade Calculator</h1>
            <p>Enter student details and marks</p>
        </div>

        <div class="card">

            <div class="input-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName"
                    placeholder="Enter student name">
            </div>

            <div class="input-group">
                <label for="subject1">Subject 1</label>
                <input type="number" id="subject1"
                    min="0" max="100"
                    placeholder="Enter marks">
            </div>

            <div class="input-group">
                <label for="subject2">Subject 2</label>
                <input type="number" id="subject2"
                    min="0" max="100"
                    placeholder="Enter marks">
            </div>

            <div class="input-group">
                <label for="subject3">Subject 3</label>
                <input type="number" id="subject3"
                    min="0" max="100"
                    placeholder="Enter marks">
            </div>

            <div class="input-group">
                <label for="subject4">Subject 4</label>
                <input type="number" id="subject4"
                    min="0" max="100"
                    placeholder="Enter marks">
            </div>

            <div class="input-group">
                <label for="subject5">Subject 5</label>
                <input type="number" id="subject5"
                    min="0" max="100"
                    placeholder="Enter marks">
            </div>

            <button onclick="calculateResult()">
                Calculate Result
            </button>

            <button class="reset" onclick="resetResult()">
                Reset
            </button>

        </div>


        <div class="result-card">

            <h2>Student Result</h2>

            <div class="student-name">
                <span>Student Name</span>
                <strong id="resultName">-</strong>
            </div>

            <div class="result-grid">

                <div class="result">
                    <span>Total</span>
                    <strong id="total">-</strong>
                </div>

                <div class="result">
                    <span>Average</span>
                    <strong id="average">-</strong>
                </div>

                <div class="result">
                    <span>Grade</span>
                    <strong id="grade">-</strong>
                </div>

                <div class="result">
                    <span>Status</span>
                    <strong id="status">-</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
